openapi: 3.0.3
info:
  title: FarmDash Futures Strategist API
  version: 2.1.0
  description: |
    WARNING: Running trade executions and cancellations places real perpetual futures trades and alters active market exposure, carrying significant risk of financial loss. Immediate, explicit manual end-user confirmation and consent is strictly required immediately before placing any execution or cancellation request. Do not allow autonomous agents to auto-run trade execution or cancellation without manual user approval.

    REST API for payment-enabled AI agents to research, analyze, and prepare user-approved
    execution of perpetual futures trades on Hyperliquid as part of FarmDash DeFi discovery and onchain services. The Futures Strategist is an
    adaptive execution engine: it returns structured strategy objects,
    confidence, market regime, adaptive risk, portfolio context, pre-trade
    simulation, and explicit no-trade outcomes before any order is placed.

    ## Authentication
    - **Primary optional credential**: `Authorization: Bearer <FARMDASH_API_KEY>`.
    - **Scout (Free)**: Omit the bearer token. Limited analysis and execution quota (5/day).
    - **Pioneer**: Use a Pioneer-tier `FARMDASH_API_KEY`. Full analysis, sizing, and unlimited compatibility execution.
    - **Syndicate**: Use a Syndicate-tier `FARMDASH_API_KEY`. Full analysis, sizing, and unlimited compatibility execution.
    - **Execution auth**: `execute-order` and `cancel-order` require a fresh EIP-712 signature from the user's Hyperliquid API wallet on every request.
    - **Signer binding**: FarmDash recovers the signer from the exact Hyperliquid L1 action, nonce, expiry, environment, and any subaccount/vault routing address and rejects a mismatch with `agentAddress`.
    - **Delegation binding**: when `accountAddress` differs, Hyperliquid `userRole` must report `agentAddress` as its active API wallet; if the owner is a subaccount or vault, that address is included as `vaultAddress` in both the signature hash and exchange request. Ambiguity fails closed.
    - **Important**: The bearer token gates FarmDash tier access and rate limits only. It never replaces the per-request EIP-712 signature and does not let FarmDash sign on the user's behalf.

    ## Hard Guardrails (Server-Enforced)
    - Max leverage: 5x
    - Max risk per trade: 2% of equity before adaptive reductions
    - Daily loss limit: -3% -> trading halted 24h
    - Research required before execution (analyze-strategy within 60 seconds)

    ## Intent Hardening
    `execute-order` requires `nonce`, `expiresAt`, and `intentHash` for
    deterministic, auditable order intents. `cancel-order` also requires them.

    ## Dust Storm Protocol
    Upstream failures return `ok:false` with typed degraded state and
    `dust_storm` warnings. Agents should retry only after inspecting the
    degraded state and any stale-data age.
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT

servers:
  - url: https://www.farmdash.one/api
    description: Production

paths:
  /v1/agent/futures/scan-funding:
    get:
      operationId: scanFundingRates
      summary: Scan all Hyperliquid funding rates for arb opportunities
      description: |
        Returns current and predicted funding rates across all Hyperliquid perp
        markets. Cross-references with Binance and Bybit to identify arbitrage
        opportunities where HL funding diverges from other venues.
        Scout tier receives top 3 opportunities with encrypted numerics.
      tags: [Research]
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Funding rate scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  arbOpportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingAnalysis'
                  highFunding:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingAnalysis'
                  totalScanned:
                    type: integer
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warning'
        '429':
          description: Rate limit exceeded

  /v1/agent/futures/market-conditions:
    get:
      operationId: getMarketConditions
      summary: Get technical indicators for an asset
      description: |
        Returns EMA-8/34, RSI-14, MACD(12,26,9), ATR-14, Bollinger Bands(20,2),
        ADX-14, volume ratio, and Z-score for a given asset using 4h candles.
        Includes a strategy hint based on indicator confluence.
      tags: [Research]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: coin
          in: query
          required: true
          schema:
            type: string
          description: Asset symbol (e.g., ETH, BTC, SOL, HYPE)
      responses:
        '200':
          description: Technical indicators
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  coin:
                    type: string
                  indicators:
                    $ref: '#/components/schemas/TechnicalIndicators'
                  strategyHint:
                    type: string
                    enum: [momentum_long, momentum_short, trend_pullback_long, trend_pullback_short, mean_reversion, no_trade]

  /v1/agent/futures/account-state:
    get:
      operationId: getAccountState
      summary: Get agent's Hyperliquid positions and risk state
      description: |
        Returns the agent's current positions, margin summary, equity,
        unrealized PnL, liquidation prices, and risk management state.
        Daily/weekly values are conservative loss-pressure metrics: rolling
        closed PnL minus absolute fill fees plus funding and negative current
        unrealized PnL only. Positive open gains cannot mask a realized-loss
        breach; these fields are not full period-return calculations.
        `agentAddress` identifies the API signer/FarmDash caller. For a
        delegated API wallet, `accountAddress` must identify the Hyperliquid
        master or subaccount that actually owns the equity and positions. Omit
        `accountAddress` only when the signer directly owns the account. It does not require a private key or seed phrase. The
        signer/owner relationship is verified against Hyperliquid `userRole`.
      tags: [Account]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: agentAddress
          in: query
          required: true
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: EIP-712/API-wallet signer and FarmDash caller identity
        - name: accountAddress
          in: query
          required: false
          schema:
            type: string
            pattern: '^0x[a-fA-F0-9]{40}$'
          description: Hyperliquid master/subaccount that owns the equity. Defaults to agentAddress only for a direct signer.
      responses:
        '200':
          description: Account state with risk info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  risk:
                    $ref: '#/components/schemas/RiskState'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'

  /v1/agent/futures/analyze-strategy:
    post:
      operationId: analyzeStrategy
      summary: Full research pipeline with strategy recommendation
      description: |
        Runs the complete research pipeline: funding rates, technical indicators,
        order book liquidity, Trail Heat cross-reference, and risk budget.
        Returns a single actionable strategy recommendation with position sizing.
        Available under the Scout daily quota or a Pioneer/Syndicate tier. The
        bearer token controls access only; it does not authorize trade execution.
        For a delegated API wallet, set `accountAddress` to the master/subaccount
        whose equity and venue history must determine size and loss guards.
      tags: [Strategy]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coin, agentAddress]
              properties:
                coin:
                  type: string
                  description: Asset symbol (e.g., ETH, BTC, SOL)
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: EIP-712/API-wallet signer and FarmDash caller identity
                accountAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: Hyperliquid master/subaccount that owns the equity. Defaults to agentAddress only for a direct signer.
                riskMultiplier:
                  type: number
                  description: Optional flexibility modifier for risk tolerance. 1.0 is default (2% max). 0.5 is conservative (1% max). Server caps at 1.0.
      responses:
        '200':
          description: Strategy recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  recommendation:
                    $ref: '#/components/schemas/StrategyRecommendation'
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'
                  researchGate:
                    type: object
                    description: Sixty-second research gate binding market, side, maximum size, entry drift, leverage metadata, and stop-derived risk.
                    properties:
                      scope:
                        type: string
                        enum: [agent_market_direction_size_entry_leverage_risk]
                      agentAddress:
                        type: string
                      accountAddress:
                        type: string
                        description: Equity owner bound into sizing and execution authorization.
                      coin:
                        type: string
                      direction:
                        type: string
                        enum: [long, short, neutral, unknown]
                      confidence:
                        type: number
                        nullable: true
                        description: Heuristic score on a 0-100 scale; not a calibrated probability.
                      confidenceScale:
                        type: string
                      strategy:
                        type: string
                      entry:
                        type: number
                        nullable: true
                      stopLoss:
                        type: number
                        nullable: true
                      maxPositionSize:
                        type: number
                        nullable: true
                      maxLeverage:
                        type: number
                        nullable: true
                      riskPercent:
                        type: number
                        nullable: true
                      executionReady:
                        type: boolean
                      maxEntryDeviationBps:
                        type: number
                      recommendationHash:
                        type: string
                      expiresAt:
                        type: integer
                      requiredForExecution:
                        type: boolean
        '402':
          description: Scout quota exhausted; a paid tier or accepted x402 overage is required

  /v1/agent/futures/position-sizing:
    post:
      operationId: calculatePositionSize
      summary: Position size calculator with guardrail enforcement
      description: |
        Given entry price, stop price, account equity, and risk percentage,
        returns the exact position size, leverage, and margin required.
        All guardrails enforced server-side (max leverage 5x, max risk 2%).
        Requires `Authorization: Bearer <FARMDASH_API_KEY>` with Pioneer or
        Syndicate tier.
      tags: [Strategy]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equity, entryPrice, stopPrice]
              properties:
                equity:
                  type: number
                  description: Account equity in USD
                entryPrice:
                  type: number
                  description: Planned entry price
                stopPrice:
                  type: number
                  description: Stop-loss price
                riskPercent:
                  type: number
                  description: Risk per trade as decimal (default 0.02 = 2%, server caps at 0.02)
                targetPrice:
                  type: number
                  description: Take-profit price (for R:R calculation)
                riskMultiplier:
                  type: number
                  description: Optional flexibility modifier for risk tolerance. 1.0 is default (2% max). 0.5 is conservative (1% max). Server caps at 1.0.
      responses:
        '200':
          description: Position sizing result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sizing:
                    $ref: '#/components/schemas/PositionSizing'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'
        '402':
          description: Pioneer tier required

  /v1/agent/futures/execute-order:
    post:
      operationId: executeOrder
      summary: Execute a pre-signed order on Hyperliquid
      description: |
        Forwards a pre-signed EIP-712 order to Hyperliquid's exchange API.
        Requires an execution-ready analyze-strategy call within 60 seconds. The
        gate binds market, side, maximum size, 50 bps entry drift, maximum
        analyzed leverage metadata, stop-derived risk, and the account whose
        equity funded the sizing decision. `funding_arb` remains
        analysis-only because this endpoint cannot atomically bind both legs.
        Requires `Authorization: Bearer <FARMDASH_API_KEY>` for Pioneer/Syndicate unlimited access, or omit for free Scout access (5/day). A bearer token alone is insufficient: every request
        must also include a fresh EIP-712 signature from the user's
        Hyperliquid API wallet. All risk
        guardrails enforced server-side before forwarding. `nonce`, `expiresAt`,
        and `intentHash` are required for request-scoped expiry and auditability.
        `expiresAt` is forwarded as Hyperliquid `expiresAfter` and must be
        incorporated into the venue signature. The signed order action contains
        the FarmDash builder term `f=1`, meaning 0.1 basis point (0.001%) of
        filled notional—not 1 bp. The user must approve that builder fee on
        Hyperliquid before execution. Rejected/resting/unfilled notional is not
        reported as fee-bearing volume. FarmDash recovers the signer from the
        exact signed L1 payload and rejects any mismatch with `agentAddress`.
        When the verified owner is a Hyperliquid subaccount or vault,
        `accountAddress` is also incorporated as the signed and submitted
        `vaultAddress`; it cannot be changed after signing.
        It also preflights the account owner's Hyperliquid `maxBuilderFee` and
        blocks when the approved maximum is below `f=1`; only the main account
        wallet, not an API wallet, can sign that approval action.
        WARNING: This endpoint initiates real perpetual futures trades on Hyperliquid which can lead to substantial financial loss. You must explicitly present all trade details, fees, and leverage levels to the user, and obtain their manual confirmation prior to calling this endpoint. Never automate or auto-run this endpoint.

      tags: [Execution]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentAddress, coin, isBuy, size, price, orderType, nonce, expiresAt, intentHash, signature]
              properties:
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: EIP-712/API-wallet signer and FarmDash caller identity
                accountAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: Hyperliquid master/subaccount whose equity was used during analysis. Defaults to agentAddress only for a direct signer.
                coin:
                  type: string
                isBuy:
                  type: boolean
                size:
                  type: string
                  description: Position size in asset units
                price:
                  type: string
                  description: Limit or trigger price
                orderType:
                  type: string
                  enum: [limit_gtc, limit_ioc, limit_alo, market, stop_loss, take_profit]
                  description: stop_loss and take_profit require reduceOnly=true.
                reduceOnly:
                  type: boolean
                  default: false
                leverage:
                  oneOf:
                    - type: number
                    - type: string
                  description: Max 5x FarmDash intent/risk metadata. This endpoint does not submit Hyperliquid's separate updateLeverage action; verify actual venue leverage independently.
                signature:
                  type: object
                  description: Fresh EIP-712 signature from the user's Hyperliquid API wallet. Required on every request; bearer token alone is insufficient.
                  properties:
                    r:
                      type: string
                    s:
                      type: string
                    v:
                      type: integer
                nonce:
                  type: integer
                expiresAt:
                  type: integer
                  description: Required unix timestamp in milliseconds. Forwarded as venue `expiresAfter`; include it when generating the Hyperliquid signature.
                intentHash:
                  type: string
                  description: Required FarmDash-side order intent hash for payload auditability.
                signedAction:
                  type: object
                  description: Pre-built Hyperliquid exchange action (optional, built server-side if omitted). If provided, it must match all request fields and contain signed `builder: { b: FarmDash treasury, f: 1 }`; Hyperliquid f units are tenths of a basis point.
      responses:
        '200':
          description: Order execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                  order:
                    type: object
                    description: Includes exact builder compensation terms and states that leverage is risk metadata only.
                  state:
                    type: string
                    enum: [filled, resting_unfilled]
                  intentHash:
                    type: string
                  expiresAt:
                    type: integer
                  timestamp:
                    type: integer
        '400':
          description: Risk check failed or research not performed
        '402':
          description: Scout tier quota exceeded (upgrade or pay x402 overage)

  /v1/agent/futures/cancel-order:
    post:
      operationId: cancelOrder
      summary: Cancel one or more open Hyperliquid orders
      description: |
        Cancels one or more open Hyperliquid orders using a pre-signed EIP-712
        cancellation payload. Supports batch cancellation of up to 50 order IDs.
        Requires `Authorization: Bearer <FARMDASH_API_KEY>` for Pioneer/Syndicate unlimited access, or omit for free Scout access (5/day). A bearer token alone is insufficient: every
        cancellation request must include a fresh EIP-712 signature from the
        user's Hyperliquid API wallet. For delegated signing, `accountAddress`
        identifies the venue-verified equity owner. A subaccount/vault owner is
        incorporated as `vaultAddress` in both the signature hash and exchange
        request. FarmDash recovers the exact signer before submission. Required
        `expiresAt` is forwarded as
        Hyperliquid `expiresAfter`; required `intentHash` binds the FarmDash
        request for auditability. HTTP 200 is returned only when Hyperliquid
        supplies one explicit `success` application status per requested order;
        mixed or total application errors are rejections, not cancellation success.
        WARNING: This endpoint alters active market state and cancels protective orders. Ensure the user has explicitly confirmed the action and understands the resulting exposure change before calling this endpoint. Never automate or auto-run this endpoint.

      tags: [Execution]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentAddress, coin, orderIds, nonce, expiresAt, intentHash, signature]
              properties:
                agentAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: EIP-712/API-wallet signer
                accountAddress:
                  type: string
                  pattern: '^0x[a-fA-F0-9]{40}$'
                  description: Hyperliquid master/subaccount/vault that owns the orders. Required in practice for delegated signing; defaults to agentAddress only for a direct signer.
                coin:
                  type: string
                orderIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: integer
                signature:
                  type: object
                  description: Fresh EIP-712 signature for the cancel action. Required on every request; bearer token alone is insufficient.
                  properties:
                    r:
                      type: string
                    s:
                      type: string
                    v:
                      type: integer
                nonce:
                  type: integer
                expiresAt:
                  type: integer
                  description: Required unix timestamp in milliseconds. Forwarded as venue `expiresAfter`; include it when generating the signature.
                intentHash:
                  type: string
                  description: Required FarmDash-side intent hash for payload auditability.
                signedAction:
                  type: object
                  description: Pre-built Hyperliquid cancel action (optional). If provided, it must match the request fields.
      responses:
        '200':
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  state:
                    type: string
                    enum: [cancelled, rejected, partially_rejected, unknown]
                  result:
                    type: object
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId:
                          type: integer
                        status:
                          type: object
                  cancelled:
                    type: object
                  intentHash:
                    type: string
                  expiresAt:
                    type: integer
                  timestamp:
                    type: integer
        '402':
          description: Scout tier quota exceeded (upgrade or pay x402 overage)
        '422':
          description: Hyperliquid rejected all or some cancellation application statuses
        '502':
          description: Upstream failure or incomplete/malformed venue application statuses; cancellation state is unknown

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: FARMDASH_API_KEY
      description: Optional `FARMDASH_API_KEY` bearer token. Omit for Scout-tier endpoints. Use a Pioneer-tier key or Syndicate-tier key for unlimited execution and analysis (5/day limit applies to Scout). This bearer token gates tier access only and never replaces the required EIP-712 execution signature.

  schemas:
    FundingAnalysis:
      type: object
      properties:
        coin:
          type: string
        fundingRate:
          type: number
          description: Current 1h funding rate
        annualizedRate:
          type: number
          description: Funding rate × 8760
        predictedRate:
          type: number
        crossVenueDelta:
          type: number
          description: HL rate minus avg(Binance, Bybit)
        premium:
          type: number
        openInterest:
          type: number
          description: Open interest in USD
        isArbOpportunity:
          type: boolean
        arbDirection:
          type: string
          enum: [long_spot_short_perp, short_spot_long_perp, null]

    TechnicalIndicators:
      type: object
      properties:
        ema8:
          type: number
        ema34:
          type: number
        emaCross:
          type: string
          enum: [bullish, bearish, neutral]
        rsi:
          type: number
        macd:
          type: number
        macdSignal:
          type: number
        macdHistogram:
          type: number
        macdCross:
          type: string
          enum: [bullish_cross, bearish_cross, neutral]
        adx:
          type: number
        atr:
          type: number
        bbUpper:
          type: number
        bbMiddle:
          type: number
        bbLower:
          type: number
        bbWidth:
          type: number
        volumeRatio:
          type: number
        zScore:
          type: number

    MarketRegime:
      type: string
      enum: [trending, ranging, high_volatility, low_liquidity]

    TradeDirection:
      type: string
      enum: [long, short, neutral]

    StrategyObject:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [futures]
        market:
          type: string
        direction:
          $ref: '#/components/schemas/TradeDirection'
        regime:
          $ref: '#/components/schemas/MarketRegime'
        triggerConditions:
          type: array
          items:
            type: string
        entryLogic:
          type: string
        exitLogic:
          type: string
        riskModel:
          type: object
          properties:
            baseRiskPercent:
              type: number
            appliedRiskPercent:
              type: number
            riskMultiplier:
              type: number
            leverageCap:
              type: number
            stopModel:
              type: string
        leverageModel:
          type: object
          properties:
            mode:
              type: string
              enum: [adaptive]
            suggested:
              type: number
            cap:
              type: number
            drivers:
              type: array
              items:
                type: string
        fallbackLogic:
          type: array
          items:
            type: string
        telemetryTracking:
          type: array
          items:
            type: string

    AdaptiveRisk:
      type: object
      properties:
        baseRiskPercent:
          type: number
        appliedRiskPercent:
          type: number
        confidenceMultiplier:
          type: number
        volatilityMultiplier:
          type: number
        drawdownMultiplier:
          type: number
        portfolioMultiplier:
          type: number
        finalRiskMultiplier:
          type: number

    TradeSimulation:
      type: object
      properties:
        methodology:
          type: string
          enum: [heuristic_preflight]
        holdingWindowHours:
          type: number
        entryValueUsd:
          type: number
        marginRequiredUsd:
          type: number
        marginImpactPct:
          type: number
        liquidationPriceEstimate:
          type: number
          nullable: true
        stopScenarioPnlUsd:
          type: number
        targetScenarioPnlUsd:
          type: number
        oneAtrMovePnlUsd:
          type: number
        estimatedFundingPnl24hUsd:
          type: number
        estimatedFundingPnl72hUsd:
          type: number

    PortfolioContext:
      type: object
      properties:
        openPositionCount:
          type: integer
        sameAssetExposureUsd:
          type: number
        sameAssetExposurePct:
          type: number
        directionalExposurePct:
          type: number
        netDirectionalBias:
          type: string
          enum: [net_long, net_short, balanced]
        concentrationWarning:
          type: string
          nullable: true

    StrategyRecommendation:
      type: object
      properties:
        recommendedStrategy:
          type: string
          enum: [funding_arb, momentum_long, momentum_short, trend_pullback_long, trend_pullback_short, mean_reversion, no_trade]
        confidence:
          type: number
          description: 0-100
        asset:
          type: string
        marketRegime:
          $ref: '#/components/schemas/MarketRegime'
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        positionSize:
          type: number
        leverage:
          type: number
          description: Always <= 5
        riskPercent:
          type: number
          description: Always <= 0.02
        reasoning:
          type: array
          items:
            type: string
        noTradeReason:
          type: string
          nullable: true
        strategyObject:
          $ref: '#/components/schemas/StrategyObject'
        adaptiveRisk:
          $ref: '#/components/schemas/AdaptiveRisk'
        simulation:
          $ref: '#/components/schemas/TradeSimulation'
        portfolioContext:
          $ref: '#/components/schemas/PortfolioContext'
        trailHeatCrossRef:
          type: object
          properties:
            protocolId:
              type: string
            score:
              type: number
            farmingOpportunity:
              type: boolean
            referralLink:
              type: string
        fundingAnalysis:
          $ref: '#/components/schemas/FundingAnalysis'
        indicators:
          $ref: '#/components/schemas/TechnicalIndicators'

    PositionSizing:
      type: object
      properties:
        positionSize:
          type: number
        positionValueUsd:
          type: number
        leverage:
          type: number
        marginRequired:
          type: number
        riskAmount:
          type: number
        riskPercent:
          type: number
        stopDistance:
          type: number
        rewardRiskRatio:
          type: number

