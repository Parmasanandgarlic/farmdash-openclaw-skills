  /v1/agent/futures/execute-order:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: executeOrder
      summary: Execute a pre-signed order on Hyperliquid
      description: |
        Forwards a pre-signed EIP-712 order to Hyperliquid's exchange API.
        Requires an execution-ready analyze-strategy call within 60 seconds. The
        gate binds market, side, maximum size, 50 bps entry drift, maximum
        analyzed leverage metadata, stop-derived risk, and the account whose
        equity funded the sizing decision. `funding_arb` remains
        analysis-only because this endpoint cannot atomically bind both legs.
        Scout capacity is available inside the shared 30 requests / 24h quota; Pioneer is capped at 1,500/day and Syndicate at 50,000/day. After the Scout quota, the default x402 overage is $0.01 USDC for one additional API call. Commercial capacity never supplies venue authority: every request
        must also include a fresh EIP-712 signature from the user's
        Hyperliquid API wallet. All risk
        guardrails enforced server-side before forwarding. `nonce`, `expiresAt`,
        and `intentHash` are required for request-scoped expiry and auditability.
        Venue nonce authority is `network + signer + nonce` across account and vault
        contexts. Durable replay control fails closed before submission.
        `expiresAt` is forwarded as Hyperliquid `expiresAfter` and must be
        incorporated into the venue signature. The signed order action contains
        the FarmDash builder term `f=1`, meaning 0.1 basis point (0.001%) of
        filled notional—not 1 bp. The user must approve that builder fee on
        Hyperliquid before execution. Rejected/resting/unfilled notional is not
        reported as fee-bearing volume. FarmDash recovers the signer from the
        exact signed L1 payload and rejects any mismatch with `agentAddress`.
        When the verified owner is a Hyperliquid subaccount or vault,
        `accountAddress` is also incorporated as the signed and submitted
        `vaultAddress`; it cannot be changed after signing.
        It also preflights the account owner's Hyperliquid `maxBuilderFee` and
        blocks when the approved maximum is below `f=1`; only the main account
        wallet, not an API wallet, can sign that approval action.
        WARNING: Real market actions can cause financial loss. USER_SIGNED requires fresh manual approval for each order/cancel. BOUNDED_AUTONOMOUS permits local agent signing without per-order confirmation only under a valid explicit owner-signed futures grant, authenticated session, venue delegation and all applicable gates. Read x-farmdash-capability-truth and live domain readiness; preparation or payment alone never authorizes dispatch.
      tags:
        - Execution
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: X-FarmDash-Session-Token
          in: header
          required: false
          schema:
            type: string
          description: Session capability for BOUNDED_AUTONOMOUS; does not grant venue signing authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agentAddress
                - coin
                - isBuy
                - size
                - price
                - orderType
                - nonce
                - expiresAt
                - intentHash
                - signature
              properties:
                executionMode:
                  type: string
                  enum:
                    - USER_SIGNED
                    - BOUNDED_AUTONOMOUS
                  default: USER_SIGNED
                  description: USER_SIGNED is preserved for unenrolled signers. Owner registration permanently enrolls the API wallet on its network across accounts, including after expiry/revocation; stripping mode/session fields cannot bypass bounded policy. Bounded dispatch returns nonretryable bounded_futures_preparation_only while rollout is not operational.
                grantId:
                  type: string
                  description: Required for BOUNDED_AUTONOMOUS
                sessionId:
                  type: string
                  description: Required for BOUNDED_AUTONOMOUS; binds session agent separately from API wallet
                sessionToken:
                  type: string
                  description: Session capability; alternatively X-FarmDash-Session-Token header
                agentAddress:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                  description: EIP-712/API-wallet signer and FarmDash caller identity
                accountAddress:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                  description: Hyperliquid master/subaccount whose equity was used during analysis. Defaults to agentAddress only for a direct signer.
                coin:
                  type: string
                isBuy:
                  type: boolean
                size:
                  type: string
                  description: Position size in asset units
                price:
                  type: string
                  description: Limit or trigger price
                orderType:
                  type: string
                  enum:
                    - limit_gtc
                    - limit_ioc
                    - limit_alo
                    - market_ioc
                    - stop_loss
                    - take_profit
                  description: '`market_ioc` is a signed, price-protected IOC limit order with a live 100 bps adverse-price cap, never an unbounded market order. stop_loss and take_profit require reduceOnly=true.'
                reduceOnly:
                  type: boolean
                  default: false
                leverage:
                  oneOf:
                    - type: number
                    - type: string
                  description: Max 5x FarmDash intent/risk metadata. This endpoint does not submit Hyperliquid's separate updateLeverage action; verify actual venue leverage independently.
                signature:
                  type: object
                  description: Fresh EIP-712 signature from the user's Hyperliquid API wallet. Required on every request; bearer token alone is insufficient.
                  properties:
                    r:
                      type: string
                    s:
                      type: string
                    v:
                      type: integer
                nonce:
                  type: integer
                expiresAt:
                  type: integer
                  description: Required unix timestamp in milliseconds. Forwarded as venue `expiresAfter`; include it when generating the Hyperliquid signature.
                intentHash:
                  type: string
                  description: Required FarmDash-side order intent hash for payload auditability.
                signedAction:
                  type: object
                  description: 'Pre-built Hyperliquid exchange action (optional, built server-side if omitted). If provided, it must match all request fields and contain signed `builder: { b: FarmDash treasury, f: 1 }`; Hyperliquid f units are tenths of a basis point.'
            examples:
              default:
                summary: executeOrder request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  agentAddress: '0x1111111111111111111111111111111111111111'
                  coin: ETH
                  isBuy: true
                  size: '1'
                  price: '1'
                  orderType: limit_gtc
                  nonce: 1
                  expiresAt: 1
                  intentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  signature:
                    r: example
                    s: example
                    v: 1
                  executionMode: USER_SIGNED
                  reduceOnly: false
      responses:
        '200':
          description: Order execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                  order:
                    type: object
                    description: Includes exact builder compensation terms and states that leverage is risk metadata only.
                  state:
                    type: string
                    enum:
                      - fully_filled
                      - partially_filled
                      - zero_fill
                      - resting_unfilled
                      - rejected
                      - unknown
                  intentHash:
                    type: string
                  expiresAt:
                    type: integer
                  timestamp:
                    type: integer
              examples:
                success:
                  summary: executeOrder HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    state: fully_filled
        '400':
          description: Risk check failed or research not performed
          x-farmdash-response-example:
            status: 400
            description: Risk check failed or research not performed
            body: null
            note: Documents status semantics without inventing a response payload.
        '402':
          description: Scout tier quota exceeded (upgrade or pay x402 overage)
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
            X-Payment-Required:
              description: Compatibility signal for x402.
              schema:
                type: string
                enum:
                  - 'true'
              example: 'true'
            X-Payment-Amount:
              description: Illustrative Base USDC base units; live 402 is authoritative.
              schema:
                type: string
              example: '10000'
            X-Payment-Chain-Id:
              description: Illustrative payment chain.
              schema:
                type: string
              example: '8453'
            X-Payment-Address:
              description: Illustrative destination; verify live 402.
              schema:
                type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              description: Illustrative Base USDC address; verify live 402.
              schema:
                type: string
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
                      amount: 0.01 USDC
                      chain: Base
                      destination: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
                      token: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      chainId: '8453'
        '422':
          description: |-
            Typed prerequisite not met, discriminated by `code`.
            `perp_dex_namespace_unsupported`: the requested market is a namespaced HIP-3 perp-DEX market, which FarmDash does not support end-to-end.
            `perp_leverage_prerequisite`: the venue's leverage for this market differs from the requested value (`leverageVenue` vs `leverageRequested`). FarmDash never mutates venue leverage and never assumes the request took effect; submit an independently signed `updateLeverage` action, then re-check venue state and resubmit. Exposure-reducing orders are not gated on leverage.
          x-farmdash-response-example:
            status: 422
            description: |-
              Typed prerequisite not met, discriminated by `code`.
              `perp_dex_namespace_unsupported`: the requested market is a namespaced HIP-3 perp-DEX market, which FarmDash does not support end-to-end.
