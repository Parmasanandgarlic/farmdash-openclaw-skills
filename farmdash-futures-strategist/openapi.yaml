openapi: 3.0.3
info:
  title: FarmDash Futures Strategist API
  version: 2.1.0
  description: |
    WARNING: Running trade executions and cancellations places real perpetual futures trades and alters active market exposure, carrying significant risk of financial loss. In USER_SIGNED, Immediate, explicit manual end-user confirmation is required for every execution or cancellation. In BOUNDED_AUTONOMOUS, an owner-signed futures policy and valid session, venue authority, exact local signature, scopes and quantitative checks replace per-order human approval. Read x-farmdash-capability-truth and the live status endpoint; policy registration or paid access never bypasses authority or runtime gates. FarmDash never receives private keys.

    REST API for payment-enabled AI agents to research, analyze, and prepare user-approved
    execution of perpetual futures trades on Hyperliquid as part of FarmDash DeFi discovery and onchain services. The Futures Strategist is an
    adaptive execution engine: it returns structured strategy objects,
    confidence, market regime, adaptive risk, portfolio context, pre-trade
    simulation, and explicit no-trade outcomes before any order is placed.

    ## Authentication
    - **Primary optional credential**: `Authorization: Bearer <FARMDASH_API_KEY>`.
    - **Scout (Free)**: Omit the bearer token. Shared limit is 30 requests / 24h. Funding preview, market conditions, and signed order/cancel capacity are available inside that quota; account state, strategy analysis, and sizing use Pioneer or eligible x402 one-offs.
    - **Pioneer**: Use a Pioneer-tier `FARMDASH_API_KEY`. Full eligible analysis/sizing and signed execution capacity up to 1,500 requests / day.
    - **Syndicate**: Use a Syndicate-tier `FARMDASH_API_KEY`. Full eligible analysis/sizing and signed execution capacity up to 50,000 requests / day.
    - **Execution auth**: `execute-order` and `cancel-order` require a fresh EIP-712 signature from the user's Hyperliquid API wallet on every request.
    - **Signer binding**: FarmDash recovers the signer from the exact Hyperliquid L1 action, nonce, expiry, environment, and any subaccount/vault routing address and rejects a mismatch with `agentAddress`.
    - **Delegation binding**: when `accountAddress` differs, Hyperliquid `userRole` must report `agentAddress` as its active API wallet; if the owner is a subaccount or vault, that address is included as `vaultAddress` in both the signature hash and exchange request. Ambiguity fails closed.
    - **Important**: The bearer token gates FarmDash tier access and rate limits only. It never replaces the per-request EIP-712 signature and does not let FarmDash sign on the user's behalf.

    ## Hard Guardrails (Server-Enforced)
    - Max leverage: 5x
    - Max risk per trade: 2% of equity before adaptive reductions
    - Daily loss limit: -3% -> trading halted 24h
    - Research required before risk-increasing execution (analyze-strategy within 60 seconds); proven bounded reducing/cancel actions do not require unused entry capacity but retain all authority and signature checks.

    ## Intent Hardening
    `execute-order` requires `nonce`, `expiresAt`, and `intentHash` for
    deterministic, auditable order intents. `cancel-order` also requires them.

    ## Dust Storm Protocol
    Upstream failures return `ok:false` with typed degraded state and
    `dust_storm` warnings. Read-only research may be retried after inspecting
    degraded state and stale-data age. Never resubmit an ambiguous signed venue
    action: reconcile its original durable control identity and retain liability.
  contact:
    name: FarmDash Engineering
    url: https://www.farmdash.one/agents
  license:
    name: MIT
servers:
  - url: https://www.farmdash.one/api
    description: Production
paths:
  /v1/agent/authority:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: manageFuturesAuthority
      summary: Request, register, inspect or revoke an owner-signed bounded futures policy
      description: Session token authenticates the durable session; only owner EIP-712 signature creates authority. Independent from venue delegation and commercial entitlement. Read x-farmdash-capability-truth and live domain status; every authority and runtime prerequisite remains mandatory.
      parameters:
        - name: X-FarmDash-Session-Token
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - request_futures_policy
                    - register_futures_policy
                    - get_futures_authority
                    - revoke_futures_policy
                policy:
                  $ref: '#/components/schemas/FuturesPolicy'
                signature:
                  type: string
                  description: Owner EIP-712 signature; required for register_futures_policy
                sessionId:
                  type: string
                  description: Required for get/revoke; request/register use policy.sessionId
                sessionToken:
                  type: string
                grantId:
                  type: string
                  description: Required for revoke; optional exact grant filter for get
            examples:
              default:
                summary: manageFuturesAuthority request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  action: request_futures_policy
      responses:
        '200':
          description: Validated policy typed data, registered grant, durable grant utilization, or revocation result
          x-farmdash-response-example:
            status: 200
            description: Validated policy typed data, registered grant, durable grant utilization, or revocation result
            body: null
            note: Documents status semantics without inventing a response payload.
        '400':
          description: Invalid input
          x-farmdash-response-example:
            status: 400
            description: Invalid input
            body: null
            note: Documents status semantics without inventing a response payload.
        '403':
          description: Session, owner or policy verification denied
          x-farmdash-response-example:
            status: 403
            description: Session, owner or policy verification denied
            body: null
            note: Documents status semantics without inventing a response payload.
        '503':
          description: Durable authority storage unavailable; fail closed
          x-farmdash-response-example:
            status: 503
            description: Durable authority storage unavailable; fail closed
            body: null
            note: Documents status semantics without inventing a response payload.
  /v1/agent/futures/scan-funding:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: scanFundingRates
      summary: Scan all Hyperliquid funding rates for arb opportunities
      description: |
        Returns current and predicted funding rates across all Hyperliquid perp
        markets. Cross-references with Binance and Bybit to identify arbitrage
        opportunities where HL funding diverges from other venues.
        Scout receives the top 3 opportunities with ordinary numeric fields. After the Scout quota, the `default_overage` x402 one-off ($0.01 USDC by default) returns Pioneer-depth data for that request.
        Only default-DEX Hyperliquid markets are returned. Namespaced HIP-3 perp-DEX markets (for example `HYNA:ETH`) are unsupported end-to-end, so they are filtered out here rather than ranked and then refused at execution.
      tags:
        - Research
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Funding rate scan results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  arbOpportunities:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingAnalysis'
                  highFunding:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundingAnalysis'
                  totalScanned:
                    type: integer
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warning'
              examples:
                success:
                  summary: scanFundingRates HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    ok: true
                    arbOpportunities:
                      - arbDirection: long_spot_short_perp
                    highFunding:
                      - arbDirection: long_spot_short_perp
                    totalScanned: 1
                    warnings:
                      - kind: unknown
                        message: Illustrative FarmDash API example.
        '429':
          description: Rate limit exceeded
          x-farmdash-response-example:
            status: 429
            description: Rate limit exceeded
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/futures/scan-funding
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/futures/market-conditions:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getMarketConditions
      summary: Get technical indicators for an asset
      description: |
        Returns EMA-8/34, RSI-14, MACD(12,26,9), ATR-14, Bollinger Bands(20,2),
        ADX-14, volume ratio, and Z-score for a given asset using 4h candles.
        Includes a strategy hint based on indicator confluence.
      tags:
        - Research
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: coin
          in: query
          required: true
          schema:
            type: string
          description: Asset symbol (e.g., ETH, BTC, SOL, HYPE)
      responses:
        '200':
          description: Technical indicators
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  coin:
                    type: string
                  indicators:
                    $ref: '#/components/schemas/TechnicalIndicators'
                  strategyHint:
                    type: string
                    enum:
                      - momentum_long
                      - momentum_short
                      - trend_pullback_long
                      - trend_pullback_short
                      - mean_reversion
                      - no_trade
              examples:
                success:
                  summary: getMarketConditions HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    strategyHint: momentum_long
        '422':
          description: 'Namespaced HIP-3 perp-DEX market is unsupported. The body carries `code: perp_dex_namespace_unsupported` with the requested `market` and its `dex`; trade a default-DEX market instead.'
          x-farmdash-response-example:
            status: 422
            description: 'Namespaced HIP-3 perp-DEX market is unsupported. The body carries `code: perp_dex_namespace_unsupported` with the requested `market` and its `dex`; trade a default-DEX market instead.'
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/futures/market-conditions?coin=ETH
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/futures/account-state:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    get:
      operationId: getAccountState
      summary: Get agent's Hyperliquid positions and risk state
      description: |
        Returns the agent's current positions, margin summary, equity,
        unrealized PnL, liquidation prices, and risk management state.
        Daily/weekly values are conservative loss-pressure metrics: rolling
        closed PnL minus absolute fill fees plus funding and negative current
        unrealized PnL only. Positive open gains cannot mask a realized-loss
        breach; these fields are not full period-return calculations.
        `agentAddress` identifies the API signer/FarmDash caller. For a
        delegated API wallet, `accountAddress` must identify the Hyperliquid
        master or subaccount that actually owns the equity and positions. Omit
        `accountAddress` only when the signer directly owns the account. It does not require a private key or seed phrase. The
        signer/owner relationship is verified against Hyperliquid `userRole`.
      tags:
        - Account
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: agentAddress
          in: query
          required: true
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: EIP-712/API-wallet signer and FarmDash caller identity
        - name: accountAddress
          in: query
          required: false
          schema:
            type: string
            pattern: ^0x[a-fA-F0-9]{40}$
          description: Hyperliquid master/subaccount that owns the equity. Defaults to agentAddress only for a direct signer.
      responses:
        '200':
          description: Account state with risk info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  positions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Position'
                  risk:
                    $ref: '#/components/schemas/RiskState'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'
              examples:
                success:
                  summary: getAccountState HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    ok: true
                    account:
                      accountAddress: '0x1111111111111111111111111111111111111111'
                      equity: example
                      totalNotionalPosition: '1'
                      marginUsed: example
                      availableMargin: example
                      aggregateLeverage: example
                    positions:
                      - side: long
                        leverageType: cross
                    risk:
                      pnlSource: hyperliquid_venue_loss_pressure
                    guardrails:
                      maxLeverage: 1
                      maxRiskPerTrade: '1'
                      maxPositions: 1
                      dailyLossLimit: example
                      weeklyLossLimit: example
                      maxDrawdown: example
      x-farmdash-request-example:
        method: GET
        url: https://www.farmdash.one/api/v1/agent/futures/account-state?agentAddress=0x1111111111111111111111111111111111111111
        description: Concrete illustrative request; authentication, payment, and signature headers are omitted unless separately documented.
  /v1/agent/futures/analyze-strategy:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: analyzeStrategy
      summary: Full research pipeline with strategy recommendation
      description: |
        Runs the complete research pipeline: funding rates, technical indicators,
        order book liquidity, Trail Heat cross-reference, and risk budget.
        Returns a single actionable strategy recommendation with position sizing.
        Requires Pioneer/Syndicate capacity or an eligible `futures_strategy` x402 one-off ($0.20 USDC by default). The bearer token or payment controls API capacity only; it does not authorize trade execution.
        For a delegated API wallet, set `accountAddress` to the master/subaccount
        whose equity and venue history must determine size and loss guards.
      tags:
        - Strategy
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - coin
                - agentAddress
              properties:
                coin:
                  type: string
                  description: Asset symbol (e.g., ETH, BTC, SOL)
                agentAddress:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                  description: EIP-712/API-wallet signer and FarmDash caller identity
                accountAddress:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                  description: Hyperliquid master/subaccount that owns the equity. Defaults to agentAddress only for a direct signer.
                riskMultiplier:
                  type: number
                  description: Optional flexibility modifier for risk tolerance. 1.0 is default (2% max). 0.5 is conservative (1% max). Server caps at 1.0.
            examples:
              default:
                summary: analyzeStrategy request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  coin: ETH
                  agentAddress: '0x1111111111111111111111111111111111111111'
      responses:
        '200':
          description: Strategy recommendation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  recommendation:
                    $ref: '#/components/schemas/StrategyRecommendation'
                  account:
                    $ref: '#/components/schemas/AccountSummary'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'
                  researchGate:
                    type: object
                    description: Sixty-second research gate binding market, side, maximum size, entry drift, leverage metadata, and stop-derived risk.
                    properties:
                      scope:
                        type: string
                        enum:
                          - agent_market_direction_size_entry_leverage_risk
                      agentAddress:
                        type: string
                      accountAddress:
                        type: string
                        description: Equity owner bound into sizing and execution authorization.
                      coin:
                        type: string
                      direction:
                        type: string
                        enum:
                          - long
                          - short
                          - neutral
                          - unknown
                      confidence:
                        type: number
                        nullable: true
                        description: Heuristic score on a 0-100 scale; not a calibrated probability.
                      confidenceScale:
                        type: string
                      strategy:
                        type: string
                      entry:
                        type: number
                        nullable: true
                      stopLoss:
                        type: number
                        nullable: true
                      maxPositionSize:
                        type: number
                        nullable: true
                      maxLeverage:
                        type: number
                        nullable: true
                      riskPercent:
                        type: number
                        nullable: true
                      executionReady:
                        type: boolean
                      maxEntryDeviationBps:
                        type: number
                      recommendationHash:
                        type: string
                      expiresAt:
                        type: integer
                      requiredForExecution:
                        type: boolean
              examples:
                success:
                  summary: analyzeStrategy HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    ok: true
                    recommendation:
                      recommendedStrategy: funding_arb
                    account:
                      accountAddress: '0x1111111111111111111111111111111111111111'
                      equity: example
                      totalNotionalPosition: '1'
                      marginUsed: example
                      availableMargin: example
                      aggregateLeverage: example
                    guardrails:
                      maxLeverage: 1
                      maxRiskPerTrade: '1'
                      maxPositions: 1
                      dailyLossLimit: example
                      weeklyLossLimit: example
                      maxDrawdown: example
                    researchGate:
                      scope: agent_market_direction_size_entry_leverage_risk
                      direction: long
        '402':
          description: Scout quota exhausted; a paid tier or accepted x402 overage is required
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
            X-Payment-Required:
              description: Compatibility signal for x402.
              schema:
                type: string
                enum:
                  - 'true'
              example: 'true'
            X-Payment-Amount:
              description: Illustrative Base USDC base units; live 402 is authoritative.
              schema:
                type: string
              example: '10000'
            X-Payment-Chain-Id:
              description: Illustrative payment chain.
              schema:
                type: string
              example: '8453'
            X-Payment-Address:
              description: Illustrative destination; verify live 402.
              schema:
                type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              description: Illustrative Base USDC address; verify live 402.
              schema:
                type: string
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
                      amount: 0.01 USDC
                      chain: Base
                      destination: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
                      token: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
                      chainId: '8453'
        '422':
          description: 'Namespaced HIP-3 perp-DEX market is unsupported. The body carries `code: perp_dex_namespace_unsupported` with the requested `market` and its `dex`; trade a default-DEX market instead.'
          x-farmdash-response-example:
            status: 422
            description: 'Namespaced HIP-3 perp-DEX market is unsupported. The body carries `code: perp_dex_namespace_unsupported` with the requested `market` and its `dex`; trade a default-DEX market instead.'
            body: null
            note: Documents status semantics without inventing a response payload.
      x-farmdash-simulation:
        kind: heuristic_research
        side_effects: none
        authoritative_for_execution: false
        required_before_execution: false
        grants_execution_authority: false
        broadcasts_transaction: false
        proves_settlement: false
        next_step: If research supports action, obtain current account state, size the position, and use the separately authorized prepare/sign/execute flow.
  /v1/agent/futures/position-sizing:
    parameters:
      - $ref: '#/components/parameters/X-FarmDash-Installation-ID'
      - $ref: '#/components/parameters/X-FarmDash-Client'
      - $ref: '#/components/parameters/X-FarmDash-Client-Version'
      - $ref: '#/components/parameters/X-FarmDash-Skill-Version'
    post:
      operationId: calculatePositionSize
      summary: Position size calculator with guardrail enforcement
      description: |
        Given entry price, stop price, account equity, and risk percentage,
        returns the exact position size, leverage, and margin required.
        All guardrails enforced server-side (max leverage 5x, max risk 2%).
        Requires Pioneer/Syndicate capacity or an eligible `futures_strategy` x402 one-off ($0.20 USDC by default).
      tags:
        - Strategy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - equity
                - entryPrice
                - stopPrice
              properties:
                equity:
                  type: number
                  description: Account equity in USD
                entryPrice:
                  type: number
                  description: Planned entry price
                stopPrice:
                  type: number
                  description: Stop-loss price
                riskPercent:
                  type: number
                  description: Risk per trade as decimal (default 0.02 = 2%, server caps at 0.02)
                targetPrice:
                  type: number
                  description: Take-profit price (for R:R calculation)
                riskMultiplier:
                  type: number
                  description: Optional flexibility modifier for risk tolerance. 1.0 is default (2% max). 0.5 is conservative (1% max). Server caps at 1.0.
            examples:
              default:
                summary: calculatePositionSize request
                description: Illustrative schema-conformant request; replace identifiers, wallets, amounts, signatures, and timestamps with fresh values.
                value:
                  equity: 1
                  entryPrice: 1
                  stopPrice: 1
      responses:
        '200':
          description: Position sizing result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sizing:
                    $ref: '#/components/schemas/PositionSizing'
                  guardrails:
                    $ref: '#/components/schemas/Guardrails'
              examples:
                success:
                  summary: calculatePositionSize HTTP 200
                  description: Illustrative successful response generated from the published schema.
                  value:
                    ok: true
                    sizing:
                      positionSize: 1
                      positionValueUsd: 1
                      leverage: 1
                      marginRequired: 1
                      riskAmount: 1
                      riskPercent: 1
                      stopDistance: 1
                      rewardRiskRatio: 1
                    guardrails:
                      maxLeverage: 1
                      maxRiskPerTrade: '1'
                      maxPositions: 1
                      dailyLossLimit: example
                      weeklyLossLimit: example
                      maxDrawdown: example
        '402':
          description: Pioneer tier required
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired. Illustrative only; parse the live header.
              schema:
                type: string
              example: 
            X-Payment-Required:
              description: Compatibility signal for x402.
              schema:
                type: string
                enum:
                  - 'true'
              example: 'true'
            X-Payment-Amount:
              description: Illustrative Base USDC base units; live 402 is authoritative.
              schema:
                type: string
              example: '10000'
            X-Payment-Chain-Id:
              description: Illustrative payment chain.
              schema:
                type: string
              example: '8453'
            X-Payment-Address:
              description: Illustrative destination; verify live 402.
              schema:
                type: string
              example: '0xb0Ed0d7bca24BBaD635B977C2efbE06742e33377'
            X-Payment-Token:
              description: Illustrative Base USDC address; verify live 402.
              schema:
                type: string
              example: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequiredError'
              examples:
                x402_payment_required:
                  summary: Illustrative x402 payment challenge
                  description: Live 402 and PAYMENT-REQUIRED are authoritative. Payment grants API capacity only, never execution authority.
                  value:
                    ok: false
                    error: payment_required
                    code: free_quota_exhausted
                    message: Illustrative x402 challenge; live 402 is authoritative for route-specific price and policy.
                    instruction: STOP_RETRYING
                    retry_same_request: false
                    next_action: Wait for quota reset, upgrade, or attach valid x402 payment evidence and retry once.
                    quota:
                      tier: scout
                      remaining: 0
                      reset_at: '2026-10-30T12:00:00Z'
                    retryable: false
                    payment_required:
