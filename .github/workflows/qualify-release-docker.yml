name: Verify published FarmDash Dockerfile
on:
  push:
    branches: [codex/docker-qualify-8dd2afa]
permissions:
  contents: read
jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c26dee1fb7529d5d66a6254c5dea76dee6a95845
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and build the image
        run: |
          test "$(git rev-parse HEAD)" = "c26dee1fb7529d5d66a6254c5dea76dee6a95845"
          node mcp-server/scripts/verify-upstream-parity.mjs
          docker build --pull --no-cache --progress=plain -t farmdash-release-smoke .
          docker image inspect -f '{{.Id}} {{.Os}} {{.Architecture}}' farmdash-release-smoke
      - name: Verify the image serves the canonical tool definitions
        run: |
          npm ci --prefix mcp-server --no-audit --fund=false
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { Client } from './mcp-server/node_modules/@modelcontextprotocol/sdk/dist/esm/client/index.js';
          import { StdioClientTransport } from './mcp-server/node_modules/@modelcontextprotocol/sdk/dist/esm/client/stdio.js';

          const mirror = JSON.parse(readFileSync('UPSTREAM.json', 'utf8'));
          assert.equal(mirror.source_sha, '1a2a4e875e1a32bbd91d1dcef1cd6e577e6265d7');
          const transport = new StdioClientTransport({
            command: 'docker',
            args: [
              'run', '--rm', '--interactive', '--pull=never', '--network=none',
              '--cap-drop=ALL', '--security-opt=no-new-privileges',
              '--env', 'FARMDASH_MCP_PROFILE=full',
              '--env', 'FARMDASH_BASE_URL=http://127.0.0.1:9/api',
              '--env', 'FARMDASH_INSTALLATION_ID=7d6f310b-6274-4266-b377-e1282b51039a',
              'farmdash-release-smoke',
            ],
          });
          const client = new Client({ name: 'farmdash-docker-qualification', version: '1.0' });
          const tools = new Map();
          const cursors = new Set();
          try {
            await client.connect(transport, { timeout: 15000 });
            let cursor;
            do {
              const page = await client.listTools({ cursor }, { timeout: 15000 });
              for (const { name, ...definition } of page.tools) {
                assert.ok(!tools.has(name), 'Duplicated tool');
                tools.set(name, definition);
              }
              cursor = page.nextCursor;
              if (cursor) {
                assert.ok(!cursors.has(cursor), 'Repeated page cursor');
                cursors.add(cursor);
              }
            } while (cursor);

            assert.equal(tools.size, mirror.mcp_tool_count);
            const entries = [...tools.keys()].sort().map(name => [name, tools.get(name)]);
            const sha256 = createHash('sha256').update(JSON.stringify(entries)).digest('hex');
            assert.equal(sha256, 'c50b411b9d29d014b85eb450ae3f7474873794fb98e546862dce79796ce0db67');
            console.log(JSON.stringify({ canonical: mirror.source_sha, tools: tools.size, sha256 }));
          } finally {
            await client.close();
          }
          NODE
      - name: Verify public release and Glama proof over HTTPS
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash, randomUUID, randomBytes } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const host = 'https://www.farmdash.one';
          const runId = 'release-attribution-' + randomUUID();
          const installationId = randomUUID();
          const lock = JSON.parse(readFileSync('UPSTREAM.json', 'utf8'));
          const get = async (path, headers = {}) => fetch(host + path, {
            redirect: 'manual',
            signal: AbortSignal.timeout(20000),
            headers: { 'user-agent': 'FarmDash Release QA automated_test', ...headers },
          });
          const sha256 = body => createHash('sha256').update(body).digest('hex');
          const ownership = await get('/api/mcp/.well-known/glama.json', { accept: 'application/json' });
          assert.equal(ownership.status, 200);
          assert.equal(ownership.headers.get('location'), null);
          assert.match(ownership.headers.get('content-type'), /^application\/json/);
          assert.equal(sha256(await ownership.text()), '93cba9ae474feae1b83b45060a0dd2e92e77f57b9a4a1755daaf7fe2ae5b2489');
          const skills = Object.keys(lock.mirrored).filter(name => /^farmdash-\S+\/SKILL\.(json|md)$/.test(name));
          const normalized = text => text.replaceAll('\r\n', '\n');
          for (let offset = 0; offset < skills.length; offset += 4) {
            await Promise.all(skills.slice(offset, offset + 4).map(async name => {
              const res = await get('/openclaw-skills/' + name);
              assert.equal(res.status, 200, name);
              assert.equal(sha256(normalized(await res.text())), sha256(normalized(readFileSync(name, 'utf8'))), name);
            }));
          }
          const [homepage, openapi, redirect, report] = await Promise.all([
            get('/'), get('/agents/openapi.yaml'), get('/go/paradex'), get('/api/v1/reports/trail-heat-full'),
          ]);
          assert.equal(homepage.status, 200);
          assert.equal(openapi.status, 200);
          const openApiVersion = (await openapi.text()).match(/^  version: (.+)$/m)?.[1];
          assert.equal(redirect.headers.get('location'), 'https://app.paradex.trade/r/farmdashone');
          assert.equal(report.status, 402);
          const challenge = JSON.parse(Buffer.from(report.headers.get('payment-required'), 'base64').toString());
          assert.equal(challenge.farmdash.policyKey, 'report_trail_heat_full');
          assert.equal(challenge.accepts[0].amount, '100000');

          let session;
          async function mcp(id, method, params) {
            const protocol = '2025-03-26';
            const res = await fetch(host + '/api/mcp?profile=research', {
              method:'POST', redirect:'manual', signal:AbortSignal.timeout(25000),
              headers: {
                accept:'application/json, text/event-stream', 'content-type':'application/json',
                'mcp-protocol-version':protocol, 'user-agent':'FarmDash Release QA automated_test',
                'x-farmdash-test-probe':'automated_test', 'x-farmdash-run-id':runId,
                'x-farmdash-test-case-id':'release-hosted-scout-attribution', 'x-farmdash-installation-id':installationId,
                'x-farmdash-client':'mcp', ...(session ? {'mcp-session-id':session} : {}),
              },
              body: JSON.stringify({ jsonrpc:'2.0', id, method, params }),
            });
            assert.equal(res.status, 200, method);
            session ||= res.headers.get('mcp-session-id');
            const text = await res.text();
            return text.startsWith('{') ? JSON.parse(text).result
              : JSON.parse(text.split('\n').find(line => line.startsWith('data:')).slice(5)).result;
          }
          const initialized = await mcp(1, 'initialize', {
            protocolVersion:'2025-03-26', capabilities:{}, clientInfo:{name:'farmdash-release-qa',version:'1.0'},
          });
          assert.equal(initialized.protocolVersion, '2025-03-26');
          const listed = await mcp(2, 'tools/list', {});
          const paused = await mcp(3, 'tools/call', {name:'get_discovery_heuristic_report', arguments:{}});
          assert.equal(JSON.parse(paused.content[0].text).response.code, 'report_purchases_paused');
          assert.equal(paused.structuredContent, undefined);
          const scout = await mcp(4, 'tools/call', {
            name:'get_portfolio_summary', arguments:{ address:'0x' + randomBytes(20).toString('hex'), chains:'eth-mainnet' },
          });
          const scoutResult = JSON.parse(scout.content[0].text);
          console.log('FARMDASH_PUBLIC_SMOKE', JSON.stringify({
            observedAt:new Date().toISOString(), canonical:lock.source_sha, glamaProofVerified:true,
            skillFilesMatched:skills.length, openApiVersion, researchTools:listed.tools.length,
            mcpServerVersion:initialized.serverInfo?.version, legacyReportUSDC:'0.10',
            pausedPurchase:true, scoutAccess:scoutResult.access ?? null, scoutPreview:scoutResult.is_preview === true,
            scoutDiagnostic:scoutResult.response?.code ?? scoutResult.code ?? null, runId,
          }));
          NODE
